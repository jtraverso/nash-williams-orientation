# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Nash-Williams' weak orientation theorem"
  description: >-
    A Lean 4 / Mathlib formalization of Nash-Williams' weak orientation theorem (1960): every
    2k-edge-connected finite graph has a k-arc-connected orientation, i.e. one in which every
    nonempty proper vertex set is left by at least k arcs. It is proved for finite loopless
    multigraphs given by an edge family, and stated for simple graphs with Mathlib's
    SimpleGraph.IsEdgeConnected and orientations as Mathlib Digraphs. The proof is by induction
    on the number of edges, with Mader's lemma (a minimally 2k-edge-connected multigraph has a
    vertex of degree 2k) and Lovász's splitting lemma, both proved in the project. Mathlib does
    not contain these results.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C20", "05C40"]

sources:
  - title: "On Orientations, Connectivity and Odd-Vertex-Pairings in Finite Graphs"
    authors:
      - "C. St. J. A. Nash-Williams"
    id: "doi:10.4153/CJM-1960-049-6"
    type: "paper"
    location: "Canadian Journal of Mathematics 12 (1960), 555–567"
    relationship: "formalizes"
    note: >-
      The weak orientation theorem (2k-edge-connected implies a k-arc-connected orientation). The
      formal proof follows the later splitting-off argument, not Nash-Williams' original proof.
    license: "all rights reserved"
    author_endorsement: "n/a"
  - title: "On some connectivity properties of Eulerian graphs"
    authors:
      - "L. Lovász"
    id: "doi:10.1007/BF01902503"
    type: "paper"
    location: "Acta Mathematica Academiae Scientiarum Hungaricae 28 (1976), 129–138"
    relationship: "background"
    note: "The splitting lemma used in the proof."
    license: "all rights reserved"
    author_endorsement: "n/a"
  - title: "A Reduction Method for Edge-Connectivity in Graphs"
    authors:
      - "W. Mader"
    id: "doi:10.1016/S0167-5060(08)70504-1"
    type: "paper"
    location: "Annals of Discrete Mathematics 3 (1978), 145–164"
    relationship: "background"
    note: "Edge-splitting methods for edge-connectivity."
    license: "all rights reserved"
    author_endorsement: "n/a"

status:
  scope: >-
    The theorem is proved for all finite loopless multigraphs and all k, and the simple-graph
    corollary for every finite nonempty vertex type.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced the proofs (Aristotle project 0b8adf77) on the pinned toolchain from the formal
        statements and a suggested proof route (Mader's lemma and Lovász's splitting lemma).
      cost:
        wall_time: "about one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and a natural-language proof route."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, audit of the return (statements, headers, no sorry or native_decide),
        packaging of the five library files under the module prefix NashWilliamsLib, and the
        Palomar packaging, checked with `lake build`, `#print axioms` and a comparison of the
        elaborated Challenge and Solution declarations (Lean v4.35.0-rc3, Mathlib
        c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean proofs are AI-generated and mechanically
    verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound, identical
    elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    Multigraphs are edge families ends : ι → V × V over a finite index type; looplessness is a
    hypothesis of the statement although the proof does not need it (loops never cross a cut).
    Edge-connectivity is expressed through cuts of nonempty proper vertex sets, and an
    orientation through a choice o : ι → Bool. In the simple-graph corollary the conclusion
    counts the ordered pairs (u, v) ∈ S × Sᶜ with an arc u → v; its decidability is provided
    classically. The hypothesis [Nonempty V] is kept although the proof does not need it.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with the paper and checked degenerate cases, and confirmed by a
    local `lake build`, `#print axioms` and a comparison of the fully elaborated Challenge and
    Solution declarations that the proofs use no `sorry` and only propext, Classical.choice and
    Quot.sound. The author directed the work. No independent human mathematical review has been
    performed. The theorem is that of the cited paper; no mathematical novelty is claimed.

alignment:
  namespace: "NashWilliamsOrientation"
  statements:
    - source: "Nash-Williams (1960), weak orientation theorem (multigraphs)"
      lean: "NashWilliamsOrientation.nash_williams"
      module: "Challenge"
      status: "proved"
    - source: "Nash-Williams (1960), weak orientation theorem (simple graphs)"
      lean: "NashWilliamsOrientation.nash_williams_simple"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle.
